name: Build, Scan, Push and Deploy

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/bpcalculator

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run tests (unit + integration + BDD + coverage + SpotBugs)
        run: mvn -B clean verify
      - name: SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }} \
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }} \
            -Dsonar.qualitygate.wait=true

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Cache OWASP dependency-check data
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          restore-keys: dependency-check-${{ runner.os }}-
      - name: OWASP dependency-check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          args=()
          if [ -n "${NVD_API_KEY:-}" ]; then
            args+=("-DnvdApiKey=${NVD_API_KEY}")
          fi
          mvn -B -Psecurity org.owasp:dependency-check-maven:check "${args[@]}"
      - name: Upload dependency-check SARIF
        if: always() && hashFiles('target/dependency-check/dependency-check-report.sarif') != ''
        uses: github/codeql-action/upload-sarif@a3d1b77a1ba1550fbb5c74db1dc3a11f4a481126 # v3
        with:
          sarif_file: target/dependency-check/dependency-check-report.sarif
          category: dependency-check

  build-and-push:
    needs: [test, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Trivy SARIF
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@a3d1b77a1ba1550fbb5c74db1dc3a11f4a481126 # v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Azure login
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy new revision with 0% traffic
        env:
          RG: ${{ secrets.AZURE_RESOURCE_GROUP }}
          APP: ${{ secrets.AZURE_CONTAINERAPP_NAME }}
        run: |
          set -euo pipefail
          IMAGE="${IMAGE_NAME}:sha-${GITHUB_SHA}"
          SUFFIX="sha-${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}"
          echo "Deploying ${IMAGE} as revision suffix ${SUFFIX}"

          az containerapp revision set-mode -g "$RG" -n "$APP" --mode multiple

          OLD_REV=$(az containerapp ingress traffic show -g "$RG" -n "$APP" \
            --query '[?weight > `0`].revisionName | [0]' -o tsv)
          if [ -z "$OLD_REV" ]; then
            OLD_REV=$(az containerapp revision list -g "$RG" -n "$APP" \
              --query '[?properties.active].name | [-1]' -o tsv)
          fi
          echo "OLD_REV=$OLD_REV" >> "$GITHUB_ENV"

          az containerapp update -g "$RG" -n "$APP" \
            --image "$IMAGE" --revision-suffix "$SUFFIX"

          NEW_REV=$(az containerapp revision list -g "$RG" -n "$APP" \
            --query '[].name' -o tsv | grep -- "$SUFFIX" | head -1)
          if [ -z "$NEW_REV" ]; then
            echo "Could not find new revision for suffix $SUFFIX" >&2
            exit 1
          fi
          echo "NEW_REV=$NEW_REV" >> "$GITHUB_ENV"

          az containerapp ingress traffic set -g "$RG" -n "$APP" \
            --revision-weight "$OLD_REV=100" "$NEW_REV=0"

      - name: Wait for new revision to be ready
        env:
          RG: ${{ secrets.AZURE_RESOURCE_GROUP }}
          APP: ${{ secrets.AZURE_CONTAINERAPP_NAME }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            STATE=$(az containerapp revision show -g "$RG" -n "$APP" \
              --revision "$NEW_REV" --query properties.provisioningState -o tsv 2>/dev/null || true)
            [ "$STATE" = "Provisioned" ] && break
            echo "Revision $NEW_REV state: ${STATE:-unknown} ($i/30)"
            sleep 10
          done
          [ "$STATE" = "Provisioned" ] || { echo "Revision not provisioned" >&2; exit 1; }

      - name: Smoke test new revision
        env:
          RG: ${{ secrets.AZURE_RESOURCE_GROUP }}
          APP: ${{ secrets.AZURE_CONTAINERAPP_NAME }}
        run: |
          set -euo pipefail
          FQDN=$(az containerapp revision show -g "$RG" -n "$APP" \
            --revision "$NEW_REV" --query properties.fqdn -o tsv)
          echo "Smoke testing https://$FQDN/actuator/health"
          HEALTHY=0
          for i in $(seq 1 30); do
            if curl -fsS "https://$FQDN/actuator/health" | grep -q '"status":"UP"'; then
              HEALTHY=1
              break
            fi
            sleep 5
          done
          [ "$HEALTHY" = "1" ] || { echo "Health check failed" >&2; exit 1; }

      - name: Shift 100% traffic to new revision (blue-green cutover)
        env:
          RG: ${{ secrets.AZURE_RESOURCE_GROUP }}
          APP: ${{ secrets.AZURE_CONTAINERAPP_NAME }}
        run: |
          set -euo pipefail
          az containerapp ingress traffic set -g "$RG" -n "$APP" \
            --revision-weight "$OLD_REV=0" "$NEW_REV=100"

      - name: Roll back on failure
        if: failure()
        env:
          RG: ${{ secrets.AZURE_RESOURCE_GROUP }}
          APP: ${{ secrets.AZURE_CONTAINERAPP_NAME }}
        run: |
          set +e
          if [ -n "${NEW_REV:-}" ]; then
            az containerapp revision deactivate -g "$RG" -n "$APP" \
              --revision "$NEW_REV" || true
          fi
          if [ -n "${OLD_REV:-}" ]; then
            az containerapp ingress traffic set -g "$RG" -n "$APP" \
              --revision-weight "$OLD_REV=100" || true
          fi
