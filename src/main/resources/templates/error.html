<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead('bp.page.error')}"></head>
<body class="bp-body">
<header th:replace="~{fragments/layout :: siteHeader}"></header>

<main class="bp-main">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-9 col-xl-8">
                <div class="card bp-card">
                    <div class="card-body text-center">
                        <div class="bp-error-code" th:text="${status} ?: 'Error'">500</div>
                        <h1 class="bp-hero__title" th:text="#{bp.error.title}">Something went wrong</h1>
                        <p class="text-secondary" th:text="#{bp.error.body}">Body</p>
                        <p class="text-secondary" th:if="${path}">
                            <strong th:text="#{bp.error.path}">Path</strong>:
                            <code th:text="${path}">/</code>
                        </p>
                        <a class="btn btn-primary bp-btn" th:href="@{/}" th:text="#{bp.error.back}">Back</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: siteFooter}"></footer>
<footer th:replace="~{fragments/layout :: siteScripts}"></footer>
</body>
</html>
