<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="pageHead(titleKey)">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${#messages.msg(titleKey)} + ' | ' + ${#messages.msg('bp.app.name')}">BP Calculator</title>
    <script>
        (function () {
            try {
                var t = localStorage.getItem('bp-theme');
                if (!t) {
                    t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                }
                document.documentElement.setAttribute('data-bs-theme', t);
            } catch (e) {
                document.documentElement.setAttribute('data-bs-theme', 'light');
            }
        })();
    </script>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" th:href="@{/css/site.css}" />
</head>
<body class="bp-body">

<header th:fragment="siteHeader">
    <nav class="navbar navbar-expand-sm navbar-dark bp-navbar">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/}">
                <span class="bp-logo" aria-hidden="true">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/>
                    </svg>
                </span>
                <span th:text="#{bp.app.name}">BP Calculator</span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#bpNav"
                    aria-controls="bpNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="bpNav">
                <ul class="navbar-nav ms-auto align-items-sm-center gap-sm-2">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}" th:text="#{bp.nav.home}">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/privacy}" th:text="#{bp.nav.privacy}">Privacy</a>
                    </li>
                    <li class="nav-item">
                        <button class="btn bp-theme-toggle" type="button" id="themeToggle"
                                th:title="#{bp.theme.toggle}" th:aria-label="#{bp.theme.toggle}" aria-pressed="false">
                            <span class="bp-theme-icon bp-theme-icon--light" aria-hidden="true">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                                     fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="12" cy="12" r="4"/>
                                    <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
                                </svg>
                            </span>
                            <span class="bp-theme-icon bp-theme-icon--dark" aria-hidden="true">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                                     fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
                                </svg>
                            </span>
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>

<footer class="bp-footer" th:fragment="siteFooter">
    <div class="container d-flex flex-wrap justify-content-between align-items-center">
        <span th:text="#{bp.footer.copyright}">© 2025 BP Calculator</span>
        <a th:href="@{/privacy}" th:text="#{bp.nav.privacy}">Privacy Policy</a>
    </div>
</footer>

<th:block th:fragment="siteScripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/site.js}"></script>
</th:block>

</body>
</html>
