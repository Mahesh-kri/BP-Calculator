services:
  bp-calculator:
    build:
      context: .
      dockerfile: Dockerfile
    image: bpcalculator:latest
    container_name: bp-calculator
    ports:
      - "5000:5000"
    environment:
      JAVA_OPTS: "-XX:MaxRAMPercentage=75.0"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
